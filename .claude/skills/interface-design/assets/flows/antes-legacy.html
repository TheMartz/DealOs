<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema anterior · Fixture de medición</title>
<!-- Fixture para flow_meter.js: un flujo "tradicional" deliberadamente costoso
     (pantalla aparte, selects largos, confirm() y modal de éxito) para comparar contra el prototipo. -->
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; background: #f3f4f6; color: #111827; }
  header { background: #1e3a8a; color: #fff; padding: 12px 20px; font-weight: 600; }
  main { padding: 20px; max-width: 900px; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { border: 1px solid #d1d5db; padding: 8px; text-align: left; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  input, select { width: 320px; padding: 6px; }
  button { padding: 8px 14px; margin-top: 16px; }
  .dialog { position: fixed; inset: 0; background: #0006; display: grid; place-items: center; }
  .dialog > div { background: #fff; padding: 24px; border-radius: 4px; }
</style>
</head>
<body>
<header>SISTEMA DE COTIZACIONES v2.3</header>
<main id="app"></main>
<script>
const CLIENTES = ['Agroindustrias del Norte','Alimentos del Valle','Carnes Selectas','Clínica Médica Chihuahua','Colegio Americano','Desarrollos Cumbre','Ferretera Industrial','Grupo Norte','Hospital San Ángel','Seguros Horizonte','Textiles Lagunera','Transportes Bravo'];
const ESTADOS = ['Seleccione...','Borrador','Enviada','Ganada','Perdida'];
const rows = [{ t: 'Renovación flotilla 2027', c: 'Grupo Norte', m: 482000, e: 'Enviada' }];
const app = document.getElementById('app');
function lista() {
  app.innerHTML = `<h2>Listado de cotizaciones</h2><button id="nueva">Nueva cotización</button><br><br>
  <table><tr><th>Título</th><th>Cliente</th><th>Monto</th><th>Estado</th></tr>${rows.map(r => `<tr><td>${r.t}</td><td>${r.c}</td><td>${r.m}</td><td>${r.e}</td></tr>`).join('')}</table>`;
  document.getElementById('nueva').onclick = () => { location.hash = '#/nueva'; };
}
function form() {
  app.innerHTML = `<h2>Alta de cotización</h2>
  <label for="cli">Cliente</label><select id="cli"><option>Seleccione...</option>${CLIENTES.map(c => `<option>${c}</option>`).join('')}</select>
  <label for="tit">Título</label><input id="tit">
  <label for="mon">Monto</label><input id="mon">
  <label for="est">Estado</label><select id="est">${ESTADOS.map(e => `<option>${e}</option>`).join('')}</select>
  <br><button id="guardar">Guardar</button> <button id="cancelar">Cancelar</button>`;
  document.getElementById('cancelar').onclick = () => { location.hash = '#/'; };
  document.getElementById('guardar').onclick = () => {
    if (!confirm('¿Está seguro que desea guardar la cotización?')) return;
    rows.push({ t: tit.value, c: cli.value, m: mon.value, e: est.value });
    const d = document.createElement('div'); d.className = 'dialog';
    d.innerHTML = '<div role="dialog" aria-modal="true"><p>Registro guardado exitosamente.</p><button id="ok">Aceptar</button></div>';
    document.body.append(d);
    document.getElementById('ok').onclick = () => { d.remove(); location.hash = '#/'; };
  };
}
const route = () => (location.hash === '#/nueva' ? form() : lista());
addEventListener('hashchange', route); route();
</script>
</body>
</html>
