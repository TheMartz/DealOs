# Revisión de costo de interacción en cada PR.
# Copia este archivo a .github/workflows/interaction-cost.yml y ajusta las líneas marcadas con AJUSTA.
#
# Estructura esperada en el repo:
#   ux/flows/*.json      flujos a medir (URL relativa, p. ej. "/cotizaciones")
#   ux/baseline/*.json   línea base (se crea con: node <skill>/scripts/flow_meter.js check ux/flows --update-baseline ...)
#   scripts/flow_meter.js   copia del script de la skill (o ajusta FLOW_METER)
name: Costo de interacción

on:
  pull_request:
    paths: ["src/**", "app/**", "components/**", "ux/**"]   # AJUSTA a donde vive tu interfaz

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: interaction-cost-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  APP_URL: http://localhost:4173          # AJUSTA al puerto de tu app
  FLOW_METER: scripts/flow_meter.js       # AJUSTA si lo guardaste en otra ruta

jobs:
  interaction-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar Chromium para Playwright
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: Levantar la app
        # AJUSTA: build + servidor de tu proyecto. Usa datos de prueba (seed), nunca producción.
        run: |
          npm run build
          (npx --yes serve -s dist -l 4173 > /tmp/app.log 2>&1 &)
          npx --yes wait-on --timeout 120000 "$APP_URL"

      - name: Medir flujos contra la línea base
        id: check
        continue-on-error: true
        run: node "$FLOW_METER" check ux/flows --baseline ux/baseline --base-url "$APP_URL" --out flow-check --summary flow-check/resumen.md

      - name: Comentar en el PR
        if: always() && hashFiles('flow-check/resumen.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('flow-check/resumen.md', 'utf8') +
              `\n[Capturas por paso](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.includes('<!-- interaction-cost -->'));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-check
          path: flow-check/
          retention-days: 14

      - name: Fallar si algún flujo empeoró
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::Un flujo cuesta más que la línea base o ya no se completa. Revisa el comentario del PR."
          exit 1
